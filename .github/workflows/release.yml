name: Package Wispbyte release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'New release tag, for example v1.0.1'
        type: string
        required: true
permissions:
  contents: write
jobs:
  package:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci && npm run check && npm test
      - name: Publish secret-free deployment archive
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          mkdir -p dist
          git archive --format=zip --output=dist/HookMeUp-wispbyte.zip HEAD
          gh release create "$RELEASE_TAG" dist/HookMeUp-wispbyte.zip --target "$GITHUB_SHA" --title "HookMeUp $RELEASE_TAG" --notes-file docs/RELEASE_NOTES.md
