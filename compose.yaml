services:
  bot:
    build: .
    image: hookmeup:local
    init: true
    restart: unless-stopped
    env_file:
      - ${HOOKMEUP_ENV_FILE:-.env}
    environment:
      DATABASE_PATH: /app/data/hookmeup.sqlite
    volumes:
      - hookmeup-data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 35s
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: '3'
volumes:
  hookmeup-data:
    name: hookmeup-data
